name: SamurayEnd

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Получить код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установить Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Установить зависимости (лучше использовать npm ci для воспроизводимости)
      - name: Install dependencies
        run: npm ci    # или npm install, если нет lock-файла

      # 4. Собрать проект
      - name: Build project
        run: npm run build

      # 5. Подготовка Pages
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 6. Загрузка артефакта для Pages
      - name: Upload-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist   # убедитесь, что сборка кладёт результат в dist

      # 7. Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
